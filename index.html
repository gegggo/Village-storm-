<style>
/* Layout: full-height game shell. Resource header on top, square battlefield centered in a grass stage, contextual dock below. Sheets slide up for shop, army and results. Single deliberate dark look. */
:root{
  --bg:#0e1819; --panel:#162427; --panel2:#1e3337; --line:#2d4649; --fg:#e9f0ea; --muted:#8fa9a5;
  --gold:#f3bb4a; --wood:#cf9560; --go:#59d18a; --danger:#ec6450; --ink:#0b1213; --grass:#3a5738;
  --display:"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif;
  --ui:"Chakra Petch",ui-monospace,system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
html{background:var(--bg)}
body{
  background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:14px;line-height:1.35;
  padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;
}
#app{height:100%;display:flex;flex-direction:column;gap:8px;min-height:0;max-width:760px;margin:0 auto}
#res{display:grid;grid-template-columns:repeat(12,1fr);gap:6px}#res .chip{grid-column:span 3}#res .chip.small{grid-column:span 4}
.chip{flex:1 1 0;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 9px;display:flex;flex-direction:column;gap:3px}
.chip .v{display:flex;align-items:center;gap:6px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip .cap{height:3px;border-radius:2px;background:#0d1718;overflow:hidden}
.chip .cap i{display:block;height:100%;width:0}
.lootv{display:inline-flex;align-items:center;gap:4px;margin-right:8px;white-space:nowrap}.lootv b{color:var(--fg);font-variant-numeric:tabular-nums}
.dot{width:11px;height:11px;border-radius:50%;flex:none}
.dot.g{background:var(--gold);box-shadow:inset -2px -2px 0 #c78d1f}
.dot.w{background:var(--wood);border-radius:3px;box-shadow:inset -2px -2px 0 #94643a}
.dot.s{background:#a9b4bd;border-radius:3px 6px 3px 6px}.dot.i{background:#7f95b3;border-radius:2px;transform:rotate(45deg) scale(.85)}.dot.m{background:#5ee0e8;border-radius:2px;transform:rotate(45deg) scale(.85);box-shadow:inset -2px -2px 0 #2aa7b0}
.sw{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:8px;vertical-align:-1px}
.st{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;font-size:12.5px}.st span{color:var(--muted)}.st em{color:var(--go);font-style:normal;font-weight:700}
.info p.no{color:var(--danger)}.row.five .btn{font-size:14px;padding:8px 2px}.res-big{flex-wrap:wrap}.res-big .chip{flex:1 1 40%}
.chip.small{flex:0 0 auto;min-width:64px}
#res .chip .v{flex-wrap:wrap;row-gap:0;white-space:normal}
.chip .mx{flex-basis:100%;font-size:9.5px;line-height:1.1;font-weight:600;color:var(--muted,#8fa9a5);padding-left:2px;margin-top:-1px}
#res .chip{padding-bottom:6px}
#hud{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
#hud .t{font-family:var(--display);font-size:20px;letter-spacing:.02em;font-variant-numeric:tabular-nums}
#hud .meta{color:var(--muted);font-size:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#hud .meta b{color:var(--fg);font-variant-numeric:tabular-nums}
.bar{position:relative;height:8px;min-width:90px;flex:1 1 90px;border-radius:5px;background:#0d1718;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--go)}
.bar u{position:absolute;top:0;bottom:0;width:2px;background:#ffffff66}
.stars{display:inline-flex;gap:2px}
.stars svg{width:18px;height:18px}
#stage{flex:1;min-height:0;position:relative;background:var(--grass);border-radius:14px;overflow:hidden;border:1px solid var(--line)}
#cv{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);touch-action:none;display:block}
.gi{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;margin-right:10px;vertical-align:middle;background:color-mix(in srgb,var(--c) 22%,#0d1718);border:2px solid var(--c);box-shadow:inset 0 -4px 0 #0004}.gi svg{width:24px;height:24px}
.item .nm{display:flex;align-items:center}
#dock>*{flex:none}
@media not all and (min-aspect-ratio:13/10){
  body[data-mode=battle] #res{display:none}
  body[data-mode=battle] #dock{max-height:none;overflow:visible}
  body[data-mode=battle] #dock .tray{order:1}body[data-mode=battle] #dock>.row{order:2}body[data-mode=battle] #dock>.hint{order:3;font-size:11.5px}body[data-mode=battle] #dock>.info{order:4;padding:6px 10px;gap:3px}
  body[data-mode=battle] #dock .info h3{font-size:16px}body[data-mode=battle] #dock .info p{font-size:11.5px}
  body[data-mode=battle] #hud{padding:5px 10px;gap:2px 10px}body[data-mode=battle] #hud .meta{font-size:11px;gap:2px 8px}
  body[data-mode=battle] .pick{min-height:52px}
}
#toast{position:absolute;left:50%;top:10px;transform:translate(-50%,-14px);background:linear-gradient(#162427a6,#0b1213a6);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border:1px solid var(--line);border-left:3px solid var(--go);color:var(--fg);padding:6px 12px 6px 10px;border-radius:12px;font-size:12.5px;line-height:1.3;font-weight:500;letter-spacing:.1px;box-shadow:0 4px 14px #0007;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:84%;text-align:left;z-index:40}
#toast.on{opacity:1;transform:translate(-50%,0)}
#dock{display:flex;flex-direction:column;gap:8px;max-height:48vh;overflow-y:auto}
.row{display:flex;gap:8px}
.btn{flex:1 1 0;min-width:0;font-family:var(--display);font-size:17px;letter-spacing:.02em;color:var(--fg);background:var(--panel2);border:1px solid var(--line);border-bottom-width:3px;border-radius:12px;padding:10px 8px;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer}
.btn small{font-family:var(--ui);font-size:11px;font-weight:600;color:var(--muted)}
.btn:active{transform:translateY(2px);border-bottom-width:1px}
.btn.go{background:#1f6b45;border-color:#2f9a64;color:#eafff1}
.btn.go small{color:#b9efd0}
.btn.gold{background:#7a5a17;border-color:#b3862a;color:#fff3d6}
.btn.gold small{color:#f0d79a}
.btn.danger{background:#6d2a22;border-color:#a8473b}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn:focus-visible,.pick:focus-visible,.mini:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.info{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:8px}
.info h3{margin:0;font-family:var(--display);font-weight:400;font-size:19px;letter-spacing:.02em}
.info p{margin:0;color:var(--muted);font-size:12.5px}
.info .row .btn{min-height:42px;font-size:15px;padding:6px}
.cost{display:inline-flex;gap:8px;font-family:var(--ui);font-size:11.5px;font-weight:700}
.cost span{display:inline-flex;align-items:center;gap:4px}
.cost .no{color:var(--danger)}
.hint{color:var(--muted);font-size:12.5px;text-align:center}
.hint.tut{color:#fff;font-weight:700;font-size:14px;line-height:1.35;background:linear-gradient(180deg,#4a3a12,#2e2410);border:2px solid #f3bb4a;border-radius:12px;padding:9px 10px;animation:tutGlow 1.4s ease-in-out infinite}
.tutpulse{position:relative!important;outline:3px solid #f3bb4a!important;outline-offset:2px;border-radius:12px;z-index:6;animation:tutGlow 1.2s ease-in-out infinite}
@keyframes tutGlow{0%,100%{box-shadow:0 0 0 0 #f3bb4a00,0 0 8px 1px #f3bb4a88}50%{box-shadow:0 0 0 4px #f3bb4a33,0 0 22px 6px #f3bb4acc}}
@media (prefers-reduced-motion:reduce){.hint.tut,.tutpulse{animation:none!important}}
.tray{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.pick{flex:1 0 74px;background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:6px 4px;color:var(--fg);font-family:var(--ui);font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;min-height:56px}

/* Kompakter Code: JSON -> LZW (variable Bitbreite) -> Base64url, Präfix Z. Alte Codes (Base64 von JSON) laden weiter. */
function lzPack(str){

    c=String.fromCharCode(inp[i]); k=cur+c;
    if(k.length===1||d[k]!==undefined){ cur=k; continue; }
    put(cur.length===1?cur.charCodeAt(0):d[cur]);
    if(n<65535){ d[k]=n++; if(n>(1<<w)&&w<16) w++; }
    cur=c;
  }
  if(cur) put(cur.length===1?cur.charCodeAt(0):d[cur]);
  if(bits>0) out.push(buf&255);
  var s2=''; for(i=0;i<out.length;i++) s2+=String.fromCharCode(out[i]);
  return btoa(s2).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');

function lzUnpack(b64){

    else if(code<n){ ent=str(code); }
    else ent=str(prev).concat(str(prev)[0]);
    if(prev!==null&&n<65535){ tbl[n-256]=str(prev).concat(ent[0]); n++; if(n+1>(1<<w)&&w<16) w++; }

function maxTrain(k){

      resetArm=false; S=fresh(); save(); sel=null; closeSheet(true); renderAll(); break;
    case 'tab': tab=k; renderDock(); break;
    case 'desel': sel=null; confirmDel=false; renderDock(); break;
    case 'raids': openRaids(); break;
    case 'overview': openOverview(); break;
    case 'prog': openProg(); break;
    case 'leg': legArm=false; openLegacy(); break;
    case 'legbuy': var lo2=LEG.filter(function(x){return x.id===k})[0], P2=prD(); if(lo2&&lg(k)<lo2.max&&P2.pts>=legCost(lo2)){ P2.pts-=legCost(lo2); P2.up[k]=lg(k)+1; save(); openLegacy(); renderAll(); } break;
    case 'prestige': if(th()<MAXL) break; if(!legArm){ legArm=true; openLegacy(); break; } legArm=false; doPrestige(); break;
    case 'claim': var ac=ACH.filter(function(x){return x.id===k})[0]; if(ac&&!S.ach[k]&&achDone(ac)){ S.ach[k]=1; S.gems+=achG(ac); if(ac.x) addXp(ac.x); toast('Erfolg: '+ac.n+' · +'+achG(ac)+' Gems'); save(); openProg(); renderAll(); } break;
    case 'lang': showLang(); break;
    case 'gfx': GFX=!GFX; try{ localStorage.setItem('dorfsturm.gfx',GFX?'1':'0'); }catch(e){} $('#qb [data-act=gfx]').classList.toggle('off',!GFX); toast(GFX?'Grafik: Hoch':'Grafik: Normal'); break;
    case 'bkExport': bkExport(); break;
    case 'bkImport': var bf=$('#bkFile'); if(bf){ bf.value=''; bf.click(); } break;
    case 'codeGet': save(); var cb=$('#codeBox'); cb.value=toCode(); cb.select(); try{navigator.clipboard.writeText(cb.value).catch(function(){});}catch(e){} toast('Code erzeugt'); break;
    case 'codeSet': try{ var ns=fromCode($('#codeBox').value); ns.t=Date.now(); S=ns; capSingles(); save(); sel=null; closeSheet(true); renderAll(); toast('Spielstand geladen'); }catch(e){ toast('Ungültiger Code'); } break;
    case 'focus': sel=+t.getAttribute('data-id'); closeSheet(true); renderAll(); break;
    case 'swap': if(S.gems<10){ toast('Zu wenig Gems'); break; } if(S[k]>=resCap(k)){ toast('Speicher voll'); break; } S[k]=Math.min(resCap(k),S[k]+swapAmt(k)); S.gems-=10; save(); openShop(); renderAll(); break;
    case 'pick': if(bt&&bt.tray[k]>0){ bt.sel=k; renderDock(); } break;
    case 'engage': if(bt&&!bt.started){ bt.phase='deploy'; bt.prog=''; renderDock(); } break;
    case 'back': if(bt&&!bt.started){ bt.phase='scout'; bt.prog=''; renderDock(); } break;
    case 'rand': if(bt&&!bt.started&&bt.phase==='deploy') autoRandom(); break;
    case 'best': if(bt&&!bt.started&&bt.phase==='deploy') autoBest(); break;
    case 'next':
      if(!bt||bt.started) break;
      var cost=searchCost(); if(S.gold<cost){ toast(tx('searchMissing',{res:RN.gold})); break; }
      S.gold-=cost; save(); enterCamp(); break;
    case 'leave': freeLook=false; leaveBattle(); break;
    case 'surrender': if(bt&&!bt.over){ finish(); } break;
    case 'home': leaveBattle(); break;
  }
});
function bl0(){ return barracksLvl(); }

/* Eingabe auf dem Feld */
var down=false, lastDeploy=0;
function pos(e){ var r=cv.getBoundingClientRect(); return [view.ox+(e.clientX-r.left)/T,view.oy+(e.clientY-r.top)/T]; }
var pan=null;
function moveGhost(px,py){
  var d=DEFS[ghost.type];
  ghost.x=clamp(Math.round(px-d.w/2),0,GB-d.w); ghost.y=clamp(Math.round(py-d.h/2),0,GB-d.h); renderDock();
}
function fenceMode(){ return mode==='place'&&ghost&&ghost.type==='fence'&&!ghost.moveId; }
function paintFence(first){
  if(!canPlace('fence',ghost.x,ghost.y)) return;
  if(countOf('fence')>=limitOf('fence')){ if(first) toast('Zaun-Limit erreicht'); return; }
  var c=newCost('fence'); if(!afford(c)){ if(first) toast('Zu wenig Rohstoffe'); return; }
  spend(c); S.b.push({id:S.nid++,type:'fence',x:ghost.x,y:ghost.y,lvl:1,store:0}); ghost.cost=newCost('fence');
  burst(ghost.x+.5,ghost.y+.5,'#e9e2c8',6,1.8); save(); renderDock();
}
function onPtr(e,first){
  var p=pos(e), px=p[0], py=p[1];
  if(mode==='home'&&first){
    var hit=null; S.b.forEach(function(b){ var d=DEFS[b.type]; if(px>=b.x&&px<b.x+d.w&&py>=b.y&&py<b.y+d.h) hit=b; });
    confirmDel=false;
    if(hit){ sel=hit.id; if(PROD[hit.type]&&Math.floor(hit.store)>=1){ collect(hit); save(); } } else sel=null;
    renderAll();
  } else if(mode==='place'&&ghost){ moveGhost(px,py); if(fenceMode()) paintFence(first); }
  else if(mode==='battle'&&bt){
    var now=performance.now();
    if(first||now-lastDeploy>110){ if(deploy(px,py)) lastDeploy=now; else if(first&&bt.phase==='scout') toast('Tippe zuerst auf Angreifen.'); else if(first&&bt.sel&&!bt.over&&!zoneOk(px,py)) toast('Hier gesperrt. Weiter außen absetzen.'); }
  }
}
cv.addEventListener('pointerdown',function(e){ e.preventDefault(); try{cv.setPointerCapture(e.pointerId);}catch(x){} down=true; pan={x:e.clientX,y:e.clientY,m:false}; onPtr(e,true); });
cv.addEventListener('pointermove',function(e){
  if(down&&pan&&mode==='home'&&view.z>1&&!ghost){
    if(!pan.m&&Math.abs(e.clientX-pan.x)+Math.abs(e.clientY-pan.y)>6) pan.m=true;
    if(pan.m){ view.ox-=(e.clientX-pan.x)/T; view.oy-=(e.clientY-pan.y)/T; pan.x=e.clientX; pan.y=e.clientY; applyZoom(); return; }
  }
  if(down) onPtr(e,false);
});
cv.addEventListener('wheel',function(e){ e.preventDefault(); var r=cv.getBoundingClientRect(); zoomAt(e.deltaY<0?1.12:1/1.12,e.clientX-r.left,e.clientY-r.top); },{passive:false});
window.addEventListener('keydown',function(e){ if(e.target&&/INPUT|TEXTAREA/.test(e.target.tagName)) return; var cx=view.W/2, cy=view.H/2; if(e.key==='+'||e.key==='=') zoomAt(1.2,cx,cy); else if(e.key==='-') zoomAt(1/1.2,cx,cy); });
window.addEventListener('pointerup',function(){down=false});
window.addEventListener('pointercancel',function(){down=false});

/* Schleife */
var last=performance.now(), saveT=0;
function frame(now){
  var dt=Math.min(0.05,(now-last)/1000); last=now;
  if(Math.floor(stage.clientWidth)!==view.W||Math.floor(stage.clientHeight)!==view.H) fit();
  if(mode==='home'||mode==='place'){
    S.b.forEach(function(b){ if(PROD[b.type]){ b.store=Math.min(storeCap(b),b.store+rate(b)*dt); } });
  }
  if(mode==='battle'&&bt) step(dt);
  parts.forEach(function(p){ p.t+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=3*dt; });
  parts=parts.filter(function(p){return p.t<p.life});
  texts.forEach(function(t){ t.t+=dt; t.y-=0.8*dt; });
  texts=texts.filter(function(t){return t.t<1.1});
  saveT+=dt; if(Math.floor(now/1000)%30===0) raidCheck(); raidCheck.pending(); if(saveT>5){ saveT=0; save(); }
  renderRes(); renderHud();
  render(now/1000);
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange',function(){ if(document.hidden){ save(); } });
window.addEventListener('pagehide',save);
if(away>60) toast('Willkommen zurück · '+Math.round(away/60)+' Min offline produziert. Sammeln nicht vergessen');
$('#pl').setAttribute('data-act','prog'); $('#pl').style.cursor='pointer';
raidCheck(); fit(); renderAll();
requestAnimationFrame(frame);
['gesturestart','gesturechange','gestureend'].forEach(function(n){ document.addEventListener(n,function(e){ e.preventDefault(); }); });
document.addEventListener('contextmenu',function(e){ e.preventDefault(); });
})();
</script>
